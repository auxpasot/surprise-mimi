<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Une petite surprise ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background-color: #F1ACAD;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            color: white;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;

            margin: 0;
        }

        p {
            font-size: 17px;

            margin: 10px 0 0;
        }

        .hint {
            font-size: 14px;

            opacity: 0.9;
        }


        /* =========================
           CADEAU
        ========================= */

        .gift-button {

            border: none;

            background: transparent;

            cursor: pointer;

            padding: 20px;

            transition: transform 0.2s ease;
        }

        .gift-button:hover {
            transform: scale(1.08);
        }

        .gift-button:active {
            transform: scale(0.95);
        }

        .gift {

            position: relative;

            width: 130px;
            height: 115px;
        }

        .box {

            position: absolute;

            bottom: 0;
            left: 5px;

            width: 120px;
            height: 85px;

            background-color: #D95A5C;

            border-radius: 5px;
        }

        .lid {

            position: absolute;

            top: 18px;
            left: 0;

            width: 130px;
            height: 25px;

            background-color: #D95A5C;

            border-radius: 5px;

            z-index: 2;
        }

        .ribbon-vertical {

            position: absolute;

            top: 18px;
            left: 52px;

            width: 26px;
            height: 97px;

            background-color: #6F9DB5;

            z-index: 3;
        }

        .ribbon-horizontal {

            position: absolute;

            top: 18px;
            left: 0;

            width: 130px;
            height: 25px;

            background-color: #6F9DB5;

            z-index: 4;
        }

        .bow-left,
        .bow-right {

            position: absolute;

            top: 0;

            width: 42px;
            height: 30px;

            background-color: #6F9DB5;

            border-radius: 50%;

            z-index: 5;
        }

        .bow-left {

            left: 28px;

            transform: rotate(-25deg);
        }

        .bow-right {

            right: 28px;

            transform: rotate(25deg);
        }

        .bow-center {

            position: absolute;

            top: 8px;
            left: 57px;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            background-color: #6F9DB5;

            z-index: 6;
        }


        /* =========================
           CONFETTIS
        ========================= */

        .confetti {

            position: fixed;

            width: 8px;
            height: 12px;

            pointer-events: none;

            z-index: 9999;
        }

    </style>

</head>


<body>

    <main class="container">

        <div>

            <h1>
                J'ai une petite surprise pour toi ❤️
            </h1>

            <p>
                Mais il va falloir ouvrir le cadeau...
            </p>

        </div>


        <button
            class="gift-button"
            type="button"
            aria-label="Ouvrir le cadeau"
        >

            <div class="gift">

                <div class="box"></div>

                <div class="lid"></div>

                <div class="ribbon-vertical"></div>

                <div class="ribbon-horizontal"></div>

                <div class="bow-left"></div>

                <div class="bow-right"></div>

                <div class="bow-center"></div>

            </div>

        </button>

<button class="envelope-button" type="button">

    <div class="envelope">

        <div class="envelope-body"></div>

        <div class="envelope-flap"></div>

        <div class="envelope-left"></div>

        <div class="envelope-right"></div>

    </div>

</button>
        <div class="hint">
            Clique sur le cadeau
        </div>

    </main>


    <script>

        const giftButton =
            document.querySelector(".gift-button");


        giftButton.addEventListener("click", function () {


            const colors = [
                "#D95A5C",
                "#6F9DB5",
                "#FFFFFF"
            ];


            /* Création des confettis */

            for (let i = 0; i < 200; i++) {


                const confetti =
                    document.createElement("div");


                confetti.className =
                    "confetti";


                /* Couleur */

                confetti.style.backgroundColor =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];


                /* Position de départ :
                   autour du cadeau */

                const rect =
                    giftButton.getBoundingClientRect();


                const startX =
                    rect.left +
                    rect.width / 2;


                const startY =
                    rect.top +
                    rect.height / 2;


                confetti.style.left =
                    startX + "px";


                confetti.style.top =
                    startY + "px";


                document.body.appendChild(
                    confetti
                );


                /* Direction aléatoire */

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    100 +
                    Math.random() * 180;


                const x =
                    Math.cos(angle) *
                    distance;


                const y =
                    Math.sin(angle) *
                    distance;


                const rotation =
                    Math.random() *
                    720;


                /* Animation */

                confetti.animate(

                    [

                        {
                            transform:
                                "translate(0, 0) rotate(0deg)",

                            opacity: 1
                        },

                        {
                            transform:
                                "translate(" +
                                x +
                                "px, " +
                                y +
                                "px) rotate(" +
                                rotation +
                                "deg)",

                            opacity: 0
                        }

                    ],

                    {

                        duration:
                            900 +
                            Math.random() * 700,

                        easing:
                            "cubic-bezier(.2,.8,.3,1)",

                        fill:
                            "forwards"

                    }

                );


                /* Supprimer le confetti */

                setTimeout(

                    function () {

                        confetti.remove();

                    },

                    1800

                );

            }

        });
/* =========================
   ENVELOPPE
========================= */

.envelope-button {
    display: none;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 20px;
}

.envelope {
    position: relative;
    width: 180px;
    height: 120px;
}

.envelope-body {
    position: absolute;
    bottom: 0;
    width: 180px;
    height: 100px;
    background-color: #FFFFFF;
    border-radius: 5px;
}

.envelope-flap {
    position: absolute;
    top: 0;
    left: 0;

    width: 0;
    height: 0;

    border-left: 90px solid transparent;
    border-right: 90px solid transparent;
    border-top: 65px solid #D95A5C;

    z-index: 2;
}

.envelope-left {
    position: absolute;
    bottom: 0;
    left: 0;

    width: 0;
    height: 0;

    border-top: 50px solid transparent;
    border-bottom: 50px solid transparent;
    border-left: 90px solid #6F9DB5;

    z-index: 3;
}

.envelope-right {
    position: absolute;
    bottom: 0;
    right: 0;

    width: 0;
    height: 0;

    border-top: 50px solid transparent;
    border-bottom: 50px solid transparent;
    border-right: 90px solid #6F9DB5;

    z-index: 3;
}
    </script>
    <script>

    const giftButton =
        document.querySelector(".gift-button");


    giftButton.addEventListener("click", function () {

        // plein de code pour les confettis...

    });

</script>

</body>

</html>

</body>

</html>
