<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Une petite surprise ❤️</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background-color: #F1ACAD;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            color: white;
        }


        .container {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 30px;
        }


        h1 {
            font-size: 28px;
            font-weight: 500;

            margin: 0;
        }


        p {
            font-size: 17px;

            margin: 10px 0 0;
        }


        .hint {
            font-size: 14px;

            opacity: 0.9;
        }


        /* =========================
           CADEAU
        ========================= */

        .gift-button {

            border: none;

            background: transparent;

            cursor: pointer;

            padding: 20px;

            transition: transform 0.2s ease;
        }


        .gift-button:hover {
            transform: scale(1.08);
        }


        .gift-button:active {
            transform: scale(0.95);
        }


        .gift {

            position: relative;

            width: 130px;
            height: 115px;
        }


        .box {

            position: absolute;

            bottom: 0;
            left: 5px;

            width: 120px;
            height: 85px;

            background-color: #D95A5C;

            border-radius: 5px;
        }


        .lid {

            position: absolute;

            top: 18px;
            left: 0;

            width: 130px;
            height: 25px;

            background-color: #D95A5C;

            border-radius: 5px;

            z-index: 2;
        }


        .ribbon-vertical {

            position: absolute;

            top: 18px;
            left: 52px;

            width: 26px;
            height: 97px;

            background-color: #6F9DB5;

            z-index: 3;
        }


        .ribbon-horizontal {

            position: absolute;

            top: 18px;
            left: 0;

            width: 130px;
            height: 25px;

            background-color: #6F9DB5;

            z-index: 4;
        }


        .bow-left,
        .bow-right {

            position: absolute;

            top: 0;

            width: 42px;
            height: 30px;

            background-color: #6F9DB5;

            border-radius: 50%;

            z-index: 5;
        }


        .bow-left {

            left: 28px;

            transform: rotate(-25deg);
        }


        .bow-right {

            right: 28px;

            transform: rotate(25deg);
        }


        .bow-center {

            position: absolute;

            top: 8px;
            left: 57px;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            background-color: #6F9DB5;

            z-index: 6;
        }


        /* =========================
           CONFETTIS
        ========================= */

        .confetti {

            position: fixed;

            width: 8px;
            height: 12px;

            pointer-events: none;

            z-index: 9999;
        }


        /* =========================
           ENVELOPPE
        ========================= */

        .envelope-section {

            display: none;

            flex-direction: column;

            align-items: center;

            gap: 25px;
        }


        .envelope-button {

            border: none;

            background: transparent;

            cursor: pointer;

            padding: 20px;

            transition: transform 0.2s ease;
        }


        .envelope-button:hover {
            transform: scale(1.06);
        }


        .envelope {

            position: relative;

            width: 220px;
            height: 145px;

            perspective: 600px;
        }


        .envelope-back {

            position: absolute;

            bottom: 0;
            left: 0;

            width: 220px;
            height: 130px;

            background-color: white;

            border-radius: 6px;

            z-index: 1;
        }


        .envelope-left {

            position: absolute;

            bottom: 0;
            left: 0;

            width: 0;
            height: 0;

            border-top: 65px solid transparent;
            border-bottom: 65px solid transparent;
            border-left: 110px solid #6F9DB5;

            z-index: 3;
        }


        .envelope-right {

            position: absolute;

            bottom: 0;
            right: 0;

            width: 0;
            height: 0;

            border-top: 65px solid transparent;
            border-bottom: 65px solid transparent;
            border-right: 110px solid #6F9DB5;

            z-index: 3;
        }


        .envelope-bottom {

            position: absolute;

            bottom: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 110px solid transparent;
            border-right: 110px solid transparent;
            border-bottom: 70px solid #D95A5C;

            z-index: 4;
        }


        .envelope-flap {

            position: absolute;

            top: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 110px solid transparent;
            border-right: 110px solid transparent;
            border-top: 75px solid #D95A5C;

            transform-origin: top center;

            transition: transform 0.8s ease;

            z-index: 5;
        }


        /* =========================
           LETTRE
        ========================= */

        .letter {

            display: none;

            width: min(500px, 85vw);

            background-color: white;

            color: #555;

            padding: 35px;

            border-radius: 8px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);

            text-align: left;

            animation: letterAppear 0.8s ease forwards;
        }


        .letter h2 {

            margin-top: 0;

            color: #D95A5C;

            text-align: center;

            font-weight: 500;
        }


        .letter p {

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 15px;
        }


        @keyframes letterAppear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           ENVELOPPE OUVERTE
        ========================= */

        .envelope.open .envelope-flap {

            transform: rotateX(180deg);

        }


    </style>

</head>


<body>


    <main class="container">


        <!-- PREMIÈRE PAGE -->

        <section id="giftSection">

            <h1>
                J'ai une petite surprise pour toi ❤️
            </h1>

            <p>
                Mais il va falloir ouvrir le cadeau...
            </p>


            <button
                class="gift-button"
                id="giftButton"
                type="button"
                aria-label="Ouvrir le cadeau"
            >

                <div class="gift">

                    <div class="box"></div>

                    <div class="lid"></div>

                    <div class="ribbon-vertical"></div>

                    <div class="ribbon-horizontal"></div>

                    <div class="bow-left"></div>

                    <div class="bow-right"></div>

                    <div class="bow-center"></div>

                </div>

            </button>


            <div class="hint">
                Clique sur le cadeau
            </div>

        </section>



        <!-- ENVELOPPE -->

        <section
            class="envelope-section"
            id="envelopeSection"
        >

            <h1>
                Une petite lettre pour toi 💌
            </h1>


            <button
                class="envelope-button"
                id="envelopeButton"
                type="button"
                aria-label="Ouvrir l'enveloppe"
            >

                <div
                    class="envelope"
                    id="envelope"
                >

                    <div class="envelope-back"></div>

                    <div class="envelope-left"></div>

                    <div class="envelope-right"></div>

                    <div class="envelope-bottom"></div>

                    <div class="envelope-flap"></div>

                </div>

            </button>


            <div class="hint">
                Clique sur l'enveloppe
            </div>

        </section>



        <!-- LETTRE -->

        <section
            class="letter"
            id="letter"
        >

            <h2>
                Pour toi ❤️
            </h2>


            <p>
                J'avais envie de te préparer une petite surprise...
            </p>


            <p>
                Et ce n'est que le début. ✨
            </p>


            <p>
                J'espère que tu es prêt pour la suite !
            </p>

        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script>


        /* =========================
           RÉCUPÉRATION DES ÉLÉMENTS
        ========================= */

        const giftButton =
            document.getElementById("giftButton");

        const giftSection =
            document.getElementById("giftSection");

        const envelopeSection =
            document.getElementById("envelopeSection");

        const envelopeButton =
            document.getElementById("envelopeButton");

        const envelope =
            document.getElementById("envelope");

        const letter =
            document.getElementById("letter");



        /* =========================
           CLIC SUR LE CADEAU
        ========================= */

        giftButton.addEventListener("click", function () {


            /* Couleurs des confettis */

            const colors = [
                "#D95A5C",
                "#6F9DB5",
                "#FFFFFF"
            ];


            /* Création des 200 confettis */

            for (let i = 0; i < 200; i++) {


                const confetti =
                    document.createElement("div");


                confetti.className =
                    "confetti";


                /* Couleur aléatoire */

                confetti.style.backgroundColor =
                    colors[
                        Math.floor(
                            Math.random() * colors.length
                        )
                    ];


                /* Position de départ */

                const rect =
                    giftButton.getBoundingClientRect();


                const startX =
                    rect.left +
                    rect.width / 2;


                const startY =
                    rect.top +
                    rect.height / 2;


                confetti.style.left =
                    startX + "px";


                confetti.style.top =
                    startY + "px";


                document.body.appendChild(
                    confetti
                );


                /* Direction aléatoire */

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    120 +
                    Math.random() * 220;


                const x =
                    Math.cos(angle) *
                    distance;


                const y =
                    Math.sin(angle) *
                    distance;


                const rotation =
                    Math.random() *
                    720;


                /* Animation */

                confetti.animate(

                    [

                        {
                            transform:
                                "translate(0, 0) rotate(0deg)",

                            opacity: 1
                        },

                        {
                            transform:
                                "translate(" +
                                x +
                                "px, " +
                                y +
                                "px) rotate(" +
                                rotation +
                                "deg)",

                            opacity: 0
                        }

                    ],

                    {

                        duration:
                            900 +
                            Math.random() * 700,

                        easing:
                            "cubic-bezier(.2,.8,.3,1)",

                        fill:
                            "forwards"

                    }

                );


                /* Suppression */

                setTimeout(

                    function () {

                        confetti.remove();

                    },

                    1800

                );

            }



            /* Après les confettis,
               on fait disparaître le cadeau */

            setTimeout(

                function () {

                    giftSection.style.display =
                        "none";


                    envelopeSection.style.display =
                        "flex";

                },

                700

            );

        });



        /* =========================
           CLIC SUR L'ENVELOPPE
        ========================= */

        envelopeButton.addEventListener(
            "click",
            function () {


                /* Ouvrir l'enveloppe */

                envelope.classList.add("open");


                /* Faire disparaître le texte */

                envelopeSection.querySelector("h1").style.opacity =
                    "0";

                envelopeSection.querySelector(".hint").style.opacity =
                    "0";


                /* Après l'ouverture,
                   afficher la lettre */

                setTimeout(

                    function () {

                        envelopeSection.style.display =
                            "none";


                        letter.style.display =
                            "block";

                    },

                    900

                );

            }
        );


    </script>


</body>

</html>
